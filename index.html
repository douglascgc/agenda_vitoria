<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Vitória Farias</title>
<link rel="stylesheet" href="estilo.css">
<script defer src="modelo.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<aside>
  <p class="brand">Vitória Farias <small>PSICOLOGIA</small></p>
  <nav aria-label="Seções do aplicativo">
    <button class="nav-item" data-view="agenda">Agenda</button>
    <button class="nav-item" data-view="pacientes">Pacientes</button>
    <button class="nav-item" data-view="financeiro">Financeiro</button>
    <button class="nav-item" data-view="indicadores">Indicadores</button>
  </nav>
</aside>
<main>
  <header>
    <div><h1 id="title">Agenda</h1><p id="subtitle"></p></div>
    <div class="alerts">
      <button class="trigger glass" id="alert-toggle" aria-expanded="false" aria-controls="alert-panel">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
        Alertas <span class="badge" id="alert-count" hidden></span>
      </button>
      <section class="panel glass" id="alert-panel" aria-labelledby="alert-title" hidden>
        <div class="panel-heading"><h2 id="alert-title">Alertas</h2></div>
        <div id="alert-list"></div>
      </section>
    </div>
  </header>
  <p id="feedback" role="status"></p>
  <section id="content" aria-labelledby="title"></section>
</main>
<dialog id="dialog"><div id="dialog-body"></div></dialog>
</body>
</html>
